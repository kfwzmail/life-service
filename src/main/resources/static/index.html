<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>记一笔</title>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #faf9f6;
  --surface: #ffffff;
  --surface-hover: #f7f5f1;
  --border: #ece8e2;
  --border-light: #f3f0eb;
  --text: #1e1d1b;
  --text-secondary: #7b7670;
  --text-tertiary: #b5b0a8;
  --expense: #ce4844;
  --expense-bg: #fef6f5;
  --expense-border: #fde8e7;
  --income: #3d9170;
  --income-bg: #f4faf7;
  --income-border: #e2f3eb;
  --accent: #1e1d1b;
  --accent-hover: #3d3a36;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.04);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141311;
    --surface: #1d1c19;
    --surface-hover: #252320;
    --border: #2d2a26;
    --border-light: #252320;
    --text: #e8e6e1;
    --text-secondary: #9d9890;
    --text-tertiary: #635f58;
    --expense: #e86862;
    --expense-bg: #2a1f1e;
    --expense-border: #3d2423;
    --income: #4dab84;
    --income-bg: #1c2924;
    --income-border: #253d33;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.2);
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  }
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ===== Typography ===== */
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 1rem; font-weight: 600; }

.amount {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  font-weight: 600;
  letter-spacing: -.02em;
}
.amount-lg { font-size: 2.25rem; font-weight: 700; letter-spacing: -.03em; }
.amount-md { font-size: 1.25rem; }
.amount-sm { font-size: 1rem; }

/* ===== Layout ===== */
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative; }
.view { display: none; padding: 20px 20px 100px; }
.view.active { display: block; animation: fadeIn .25s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }

/* ===== Auth View ===== */
.auth-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100dvh; padding: 32px 24px;
}
.auth-header { text-align: center; margin-bottom: 40px; }
.auth-header .logo {
  width: 56px; height: 56px; border-radius: 16px; background: var(--accent);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  font-size: 24px; color: #fff;
}
.auth-header h1 { margin-bottom: 4px; }
.auth-header p { color: var(--text-secondary); font-size: .9rem; }

.auth-card {
  width: 100%; background: var(--surface); border-radius: var(--radius-lg);
  padding: 28px 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border);
}
.auth-tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(--border-light); }
.auth-tab {
  flex: 1; text-align: center; padding: 10px 0; font-size: .95rem; font-weight: 500;
  color: var(--text-secondary); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition);
}
.auth-tab.active { color: var(--text); border-bottom-color: var(--accent); }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: .82rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: .95rem; color: var(--text);
  background: var(--bg); transition: var(--transition); outline: none;
  font-family: inherit;
}
.form-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(30,29,27,.08); }
.form-input::placeholder { color: var(--text-tertiary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px; border-radius: var(--radius-sm); font-size: .9rem; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition); font-family: inherit;
  white-space: nowrap; letter-spacing: .01em;
}
.btn-primary { background: var(--accent); color: #fff; width: 100%; padding: 13px; font-size: .95rem; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(.98); }
.btn-outline {
  background: transparent; border: 1.5px solid var(--border); color: var(--text);
}
.btn-outline:hover { background: var(--surface-hover); }
.btn-sm { padding: 7px 14px; font-size: .82rem; border-radius: 6px; }
.btn-danger { color: var(--expense); }
.btn-danger:hover { background: var(--expense-bg); }

/* ===== Top Bar ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--border); }
.topbar h1 { font-size: 1.15rem; }
.topbar-actions { display: flex; gap: 8px; }

/* ===== Bottom Tabs ===== */
.bottom-tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; background: var(--surface);
  border-top: 1px solid var(--border); display: flex; z-index: 20;
  padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom));
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 0; cursor: pointer; color: var(--text-tertiary); transition: var(--transition);
  border: none; background: none; font-family: inherit; font-size: .68rem; font-weight: 500;
}
.tab-item.active { color: var(--text); }
.tab-item svg { width: 22px; height: 22px; }
.tab-item.active svg { stroke-width: 2.2; }

/* ===== Dashboard ===== */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius); padding: 18px 16px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border);
}
.stat-card.full { grid-column: 1 / -1; }
.stat-label { font-size: .78rem; color: var(--text-secondary); margin-bottom: 6px; }
.stat-card.expense .amount { color: var(--expense); }
.stat-card.income .amount { color: var(--income); }
.stat-card.balance .amount { color: var(--text); }

.section-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.section-header h2 { font-size: 1.05rem; }
.month-picker {
  display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 500;
}
.month-picker button {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: flex; align-items: center;
  justify-content: center; color: var(--text-secondary); transition: var(--transition);
}
.month-picker button:hover { border-color: var(--text-tertiary); color: var(--text); }

.breakdown-list { display: flex; flex-direction: column; gap: 10px; }
.breakdown-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border-light);
  transition: var(--transition);
}
.breakdown-icon {
  width: 38px; height: 38px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.breakdown-icon.expense { background: var(--expense-bg); }
.breakdown-icon.income { background: var(--income-bg); }
.breakdown-info { flex: 1; min-width: 0; }
.breakdown-info .name { font-size: .88rem; font-weight: 500; }
.breakdown-bar-wrap {
  height: 5px; background: var(--border-light); border-radius: 3px;
  margin-top: 6px; overflow: hidden;
}
.breakdown-bar {
  height: 100%; border-radius: 3px; transition: width .6s ease;
}
.breakdown-bar.expense { background: var(--expense); }
.breakdown-bar.income { background: var(--income); }
.breakdown-amounts { text-align: right; }
.breakdown-amounts .amount { font-size: .9rem; }
.breakdown-amounts .percent { font-size: .75rem; color: var(--text-tertiary); }

.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-tertiary);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: .6; }
.empty-state p { font-size: .88rem; }

/* ===== Bills View ===== */
.filter-bar {
  display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto;
  padding-bottom: 4px; -webkit-overflow-scrolling: touch;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 7px 14px; border-radius: 20px; font-size: .8rem; font-weight: 500;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-secondary);
  cursor: pointer; white-space: nowrap; transition: var(--transition); font-family: inherit;
}
.filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.bill-date-group { margin-bottom: 20px; }
.bill-date-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px; margin-bottom: 8px;
}
.bill-date-label { font-size: .85rem; font-weight: 600; color: var(--text-secondary); }
.bill-date-total { font-size: .82rem; color: var(--text-tertiary); }
.bill-date-total .expense { color: var(--expense); }
.bill-date-total .income { color: var(--income); }

.bill-card {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border-light);
  margin-bottom: 6px; cursor: pointer; transition: var(--transition);
}
.bill-card:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }
.bill-card .category-icon {
  width: 40px; height: 40px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.bill-card .category-icon.expense { background: var(--expense-bg); }
.bill-card .category-icon.income { background: var(--income-bg); }
.bill-info { flex: 1; min-width: 0; }
.bill-info .name { font-size: .9rem; font-weight: 500; }
.bill-info .meta { font-size: .76rem; color: var(--text-tertiary); margin-top: 2px; }
.bill-amount { text-align: right; }
.bill-amount .amount { font-size: .95rem; }
.bill-amount .amount.expense { color: var(--expense); }
.bill-amount .amount.income { color: var(--income); }
.bill-remark { font-size: .76rem; color: var(--text-tertiary); margin-top: 2px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Categories View ===== */
.cat-section { margin-bottom: 24px; }
.cat-section h3 { font-size: .85rem; color: var(--text-secondary); margin-bottom: 10px; padding: 0 4px; text-transform: uppercase; letter-spacing: .05em; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cat-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 8px; background: var(--surface); border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-light); cursor: pointer; transition: var(--transition);
  position: relative;
}
.cat-item:hover { border-color: var(--border); }
.cat-item .cat-icon {
  width: 42px; height: 42px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 22px;
}
.cat-item .cat-icon.expense { background: var(--expense-bg); }
.cat-item .cat-icon.income { background: var(--income-bg); }
.cat-item .cat-name { font-size: .76rem; font-weight: 500; text-align: center; }
.cat-item .cat-delete {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--expense); color: #fff; border: none;
  font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center;
  line-height: 1;
}
.cat-item.custom:hover .cat-delete { display: flex; }

.add-cat-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 8px; border-radius: var(--radius-sm); border: 2px dashed var(--border);
  cursor: pointer; transition: var(--transition); color: var(--text-tertiary); font-size: .76rem;
  background: transparent; font-family: inherit; min-height: 100%;
}
.add-cat-btn:hover { border-color: var(--text-tertiary); color: var(--text-secondary); }
.add-cat-btn .plus { font-size: 24px; font-weight: 300; line-height: 1; }

/* ===== FAB ===== */
.fab {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%) translateX(196px);
  width: 50px; height: 50px; border-radius: 50%; background: var(--accent);
  color: #fff; border: none; cursor: pointer; box-shadow: var(--shadow-md);
  display: flex; align-items: center; justify-content: center; z-index: 15;
  transition: var(--transition); font-size: 24px;
}
.fab:hover { background: var(--accent-hover); transform: translateX(-50%) translateX(196px) scale(1.06); }
.fab:active { transform: translateX(-50%) translateX(196px) scale(.94); }
@media (max-width: 520px) {
  .fab { right: 20px; left: auto; transform: none; }
  .fab:hover { transform: scale(1.06); }
  .fab:active { transform: scale(.94); }
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-sheet {
  width: 100%; max-width: 480px; max-height: 85dvh; overflow-y: auto;
  background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom));
  animation: slideUp .3s ease;
  box-shadow: var(--shadow-lg);
}
.modal-sheet h2 { font-size: 1.1rem; margin-bottom: 20px; }

.type-toggle {
  display: flex; background: var(--border-light); border-radius: var(--radius-sm);
  padding: 3px; margin-bottom: 20px;
}
.type-toggle button {
  flex: 1; padding: 9px; border-radius: 6px; border: none; cursor: pointer;
  font-size: .85rem; font-weight: 500; transition: var(--transition);
  background: transparent; color: var(--text-secondary); font-family: inherit;
}
.type-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.type-toggle button.active.expense { color: var(--expense); }
.type-toggle button.active.income { color: var(--income); }

.cat-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.cat-picker-item {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  border-radius: 20px; border: 1.5px solid var(--border); cursor: pointer;
  font-size: .82rem; transition: var(--transition); background: var(--surface);
  font-family: inherit;
}
.cat-picker-item:hover { border-color: var(--text-tertiary); }
.cat-picker-item.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 10px 20px; border-radius: var(--radius-sm); font-size: .85rem; font-weight: 500;
  color: #fff; background: var(--accent); box-shadow: var(--shadow-md);
  animation: fadeIn .2s ease; pointer-events: auto;
}
.toast.error { background: var(--expense); }
.toast.success { background: var(--income); }

/* ===== User Menu ===== */
.user-bar {
  display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
  margin-bottom: 20px;
}
.user-avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--accent);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600; flex-shrink: 0;
}
.user-info { flex: 1; }
.user-info .name { font-weight: 600; font-size: .95rem; }
.user-info .phone { font-size: .8rem; color: var(--text-secondary); }

/* ===== Loading ===== */
.loading {
  display: flex; align-items: center; justify-content: center; padding: 40px;
  color: var(--text-tertiary);
}
.spinner {
  width: 22px; height: 22px; border: 2px solid var(--border);
  border-top-color: var(--text-tertiary); border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Utility ===== */
.text-expense { color: var(--expense); }
.text-income { color: var(--income); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <!-- Auth View -->
  <div id="auth-view" class="view active">
    <div class="auth-container">
      <div class="auth-header">
        <div class="logo">📒</div>
        <h1>记一笔</h1>
        <p>简洁生活记账</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>
        <form id="auth-form">
          <div class="form-group">
            <label>手机号</label>
            <input class="form-input" type="tel" id="auth-phone" placeholder="请输入手机号" maxlength="11" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input class="form-input" type="password" id="auth-password" placeholder="请输入密码" minlength="6" required>
          </div>
          <div class="form-group hidden" id="nickname-group">
            <label>昵称（选填）</label>
            <input class="form-input" type="text" id="auth-nickname" placeholder="给自己取个名字吧">
          </div>
          <button type="submit" class="btn btn-primary" id="auth-submit">登录</button>
        </form>
      </div>
    </div>
  </div>

  <!-- App View -->
  <div id="app-view" class="view">
    <div id="topbar" class="topbar">
      <h1 id="topbar-title">概览</h1>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" id="btn-logout">退出</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="view active" style="padding:0 20px 100px;">
      <div class="section-header" style="margin-top:4px;">
        <h2>今日统计</h2>
      </div>
      <div class="stats-row" id="today-stats">
        <div class="stat-card expense">
          <div class="stat-label">支出</div>
          <div class="amount amount-md" id="today-expense">--</div>
        </div>
        <div class="stat-card income">
          <div class="stat-label">收入</div>
          <div class="amount amount-md" id="today-income">--</div>
        </div>
        <div class="stat-card full balance">
          <div class="stat-label">今日结余</div>
          <div class="amount amount-lg" id="today-balance">--</div>
        </div>
      </div>

      <div class="section-header" style="margin-top:8px;">
        <h2>月度分析</h2>
        <div class="month-picker">
          <button id="month-prev">‹</button>
          <span id="month-label">2026年5月</span>
          <button id="month-next">›</button>
        </div>
      </div>
      <div class="stats-row" id="month-stats">
        <div class="stat-card expense">
          <div class="stat-label">本月支出</div>
          <div class="amount amount-md" id="month-expense">--</div>
        </div>
        <div class="stat-card income">
          <div class="stat-label">本月收入</div>
          <div class="amount amount-md" id="month-income">--</div>
        </div>
      </div>

      <div id="expense-breakdown" style="margin-top:0;">
        <h3 style="font-size:.85rem;color:var(--text-secondary);margin-bottom:10px;">支出分类</h3>
        <div class="breakdown-list" id="expense-breakdown-list"></div>
      </div>
      <div id="income-breakdown" style="margin-top:20px;">
        <h3 style="font-size:.85rem;color:var(--text-secondary);margin-bottom:10px;">收入分类</h3>
        <div class="breakdown-list" id="income-breakdown-list"></div>
      </div>
    </div>

    <!-- Bills -->

<script>
/* ===== State ===== */
const state = {
  token: localStorage.getItem('token'),
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  tab: 'dashboard',
  categories: [],
  bills: [],
  todayStats: null,
  monthStats: null,
  currentMonth: new Date().toISOString().slice(0, 7),
  billTypeFilter: '',
  billPage: 1,
  billHasMore: true,
  editingBillId: null,
};

/* ===== DOM refs ===== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

/* ===== API ===== */
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, { ...options, headers });
  const json = await res.json();
  if (json.code === 200) return json.data;
  if (json.code === 401) { logout(); throw new Error('登录已过期'); }
  throw new Error(json.message || '请求失败');
}

/* ===== Toast ===== */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2200);
}

/* ===== Auth ===== */
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  $$('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === mode));
  $('#auth-submit').textContent = mode === 'login' ? '登录' : '注册';
  $('#nickname-group').classList.toggle('hidden', mode === 'login');
}

  const phone = $('#
